[package]
name = "otel-stack"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "OpenTelemetry integration for Rust — compatibility facade over otelkit with exporter selection (OTLP, stdout, Prometheus)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/otel-stack"
keywords = ["opentelemetry", "tracing", "metrics", "otlp", "observability"]
categories = ["development-tools::debugging", "web-programming"]
readme = "README.md"
exclude = ["/target"]

[dependencies]
otelkit = { version = "2.0", path = "../otelkit", features = ["otlp", "stdout", "prometheus"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"
